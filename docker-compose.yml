version: "3.8"

services:
  tapo-vision:
    build: .
    container_name: tapo-vision
    restart: always                      # Auto-restart on crash = 24/7
    network_mode: host                   # Required to reach cameras + go2rtc on LAN
    volumes:
      - ./recordings:/app/recordings     # Persist recordings to host disk
      - ./.env:/app/.env:ro              # Mount credentials read-only
    environment:
      - YOLO_OFFLINE=1
      - ULTRALYTICS_HUB=false
    # Memory limit to prevent OOM on CHEETAH (adjust based on your RAM)
    deploy:
      resources:
        limits:
          memory: 4g
    logging:
      driver: json-file
      options:
        max-size: "10m"                  # Cap Docker log files
        max-file: "3"                    # Keep 3 rotated logs

  tapo-dashboard:
    build: .
    container_name: tapo-dashboard
    restart: always
    network_mode: host                   # Exposes port 38180 on CHEETAH directly
    volumes:
      - ./recordings:/app/recordings:ro  # Read-only access to play the videos
    command: ["python", "dashboard.py"]
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "1"